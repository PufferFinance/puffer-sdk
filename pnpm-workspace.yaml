  svgo@>=3.0.0 <3.3.4: '^3.3.4'
  undici@>=6.0.0 <6.28.0: '^6.28.0'
  undici@>=7.0.0 <7.29.0: '^7.29.0'
  uuid@<11.1.1: '^11.1.1'
  webpack@<5.104.1: '^5.104.1'
  webpack-dev-server@<5.2.6: '^5.2.6'
  websocket-driver@<0.7.5: '^0.7.5'
