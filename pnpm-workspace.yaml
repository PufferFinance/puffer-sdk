packages:
  - docs

allowBuilds:
  core-js: true
  core-js-pure: true
  esbuild: true
  unrs-resolver: true

# All of these are transitive dev-only dependencies (docs/docusaurus, release-it,
# vite/vite-plugin-dts, eth-testing). The published package only ships viem.
# Each override is pinned within the affected major so nothing crosses a breaking change.
overrides:
  '@babel/core@<7.29.1': '^7.29.1'
  '@babel/plugin-transform-modules-systemjs@<7.29.4': '^7.29.4'
  ajv@>=7.0.0 <8.18.0: '^8.18.0'
  basic-ftp@<5.3.1: '^5.3.1'
  bn.js@<4.12.3: '^4.12.3'
  bn.js@>=5.0.0 <5.2.3: '^5.2.3'
  body-parser@<1.20.6: '^1.20.6'
  brace-expansion@<1.1.18: '^1.1.18'
  brace-expansion@>=2.0.0 <2.1.4: '^2.1.4'
  brace-expansion@>=3.0.0 <5.0.9: '^5.0.9'
  defu@<6.1.5: '^6.1.5'
  diff@<4.0.4: '>=4.0.4'
  fast-uri@>=3.0.0 <3.1.5: '^3.1.5'
  flatted@<3.4.2: '^3.4.2'
  follow-redirects@<1.15.12: '^1.15.12'
  http-proxy-middleware@>=0.16.0 <2.0.10: '^2.0.10'
  ip-address@<10.3.1: '^10.3.1'
  joi@<17.13.4: '^17.13.4'
  js-yaml@<3.15.0: '^3.15.0'
  js-yaml@>=4.0.0 <4.3.0: '^4.3.0'
  launch-editor@<2.14.1: '^2.14.1'
  linkify-it@<5.0.2: '^5.0.2'
  lodash@<=4.17.23: '^4.17.24'
  markdown-it@<14.2.0: '^14.2.0'
  mdast-util-to-hast@>=13.0.0 <13.2.1: '>=13.2.1'
  minimatch@<3.1.4: '^3.1.4'
  minimatch@>=9.0.0 <9.0.7: '^9.0.7'
  node-forge@<1.4.0: '^1.4.0'
  path-to-regexp@<0.1.13: '~0.1.13'
  picomatch@<2.3.2: '^2.3.2'
